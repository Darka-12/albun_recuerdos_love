<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia de Amor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Archivo CSS Personalizado -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-slate-950 via-rose-950 to-slate-900 text-slate-100 min-h-screen relative overflow-x-hidden font-poppins">

    <!-- Canvas de Fondo (Partículas de Corazones) -->
    <canvas id="heartCanvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Envoltorio Principal -->
    <div class="relative z-10 max-w-7xl mx-auto px-4 py-8 flex flex-col items-center">
        
        <!-- Encabezado / Titular -->
        <header class="text-center mb-8">
            <h1 class="font-dancing text-5xl md:text-7xl text-rose-300 drop-shadow-[0_0_15px_rgba(244,63,94,0.6)] mb-2">
                Nuestra Historia
            </h1>
            <p class="text-rose-200/80 text-sm md:text-base tracking-widest uppercase">feliz cumpleaños para el amor de mi vida</p>
        </header>

        <!-- Layout Principal: Corazón + Playlist -->
        <main class="w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            
            <!-- SECCIÓN IZQUIERDA: Mosaico en Forma de Corazón -->
            <section class="lg:col-span-7 flex justify-center items-center p-2">
                <div id="heartGrid" class="heart-grid max-w-[500px] sm:max-w-[580px] w-full">
                    <!-- Las fotos se insertan dinámicamente mediante JS -->
                </div>
            </section>

            <!-- SECCIÓN DERECHA: Reproductor de Música -->
            <section class="lg:col-span-5 flex justify-center">
                <div class="w-full max-w-md bg-slate-900/70 backdrop-blur-md border border-rose-500/20 rounded-3xl p-6 shadow-[0_0_30px_rgba(244,63,94,0.15)] flex flex-col items-center relative overflow-hidden">
                    
                    <!-- Vinilo Animado / Portada -->
                    <div class="relative mb-6 group cursor-pointer" id="albumArtContainer">
                        <div id="vinylDisc" class="w-40 h-40 rounded-full bg-slate-950 border-4 border-slate-800 flex items-center justify-center shadow-2xl relative overflow-hidden transition-transform duration-500">
                            <div class="absolute inset-2 rounded-full border border-slate-800/50"></div>
                            <div class="absolute inset-5 rounded-full border border-slate-800/50"></div>
                            <div class="absolute inset-8 rounded-full border border-slate-800/50"></div>
                            <img id="trackCover" src="https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?auto=format&fit=crop&w=300&q=80" alt="Portada de canción" class="w-20 h-20 rounded-full object-cover border-2 border-rose-400">
                        </div>
                        <div id="vinylNeedle" class="absolute -top-2 right-2 w-12 h-16 pointer-events-none origin-top-right transition-transform duration-500 transform rotate-12">
                            <div class="w-2 h-10 bg-slate-400 mx-auto rounded-full"></div>
                            <div class="w-4 h-4 bg-rose-500 rounded-full -mt-1 mx-auto shadow-md"></div>
                        </div>
                    </div>

                    <!-- Información de la Canción -->
                    <div class="text-center mb-4 w-full">
                        <h2 id="trackTitle" class="text-xl font-bold text-rose-100 truncate">Título de la Canción</h2>
                        <p id="trackArtist" class="text-sm text-rose-300/70 truncate">Nombre del Artista</p>
                    </div>

                    <!-- Ecualizador Gráfico Simplificado -->
                    <div class="flex items-end justify-center gap-1 h-6 mb-4" id="equalizer">
                        <span class="w-1 bg-rose-500/80 rounded-full eq-bar"></span>
                        <span class="w-1 bg-rose-400/80 rounded-full eq-bar"></span>
                        <span class="w-1 bg-rose-500/80 rounded-full eq-bar"></span>
                        <span class="w-1 bg-rose-300/80 rounded-full eq-bar"></span>
                        <span class="w-1 bg-rose-500/80 rounded-full eq-bar"></span>
                    </div>

                    <!-- Barra de Progreso del Audio -->
                    <div class="w-full mb-6">
                        <input type="range" id="progressBar" min="0" max="100" value="0" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-rose-500">
                        <div class="flex justify-between text-xs text-rose-200/60 mt-1">
                            <span id="currentTime">0:00</span>
                            <span id="totalDuration">0:00</span>
                        </div>
                    </div>

                    <!-- Controles del Reproductor -->
                    <div class="flex items-center justify-between w-full max-w-xs mb-6">
                        <button id="btnShuffle" class="text-slate-400 hover:text-rose-400 transition-colors">
                            <i class="fa-solid fa-shuffle text-lg"></i>
                        </button>
                        <button id="btnPrev" class="text-rose-200 hover:text-rose-400 text-xl transition-colors">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button id="btnPlay" class="w-12 h-12 rounded-full bg-rose-500 hover:bg-rose-600 text-white flex items-center justify-center text-xl shadow-lg shadow-rose-500/30 transition-all hover:scale-105">
                            <i class="fa-solid fa-play ml-0.5" id="playIcon"></i>
                        </button>
                        <button id="btnNext" class="text-rose-200 hover:text-rose-400 text-xl transition-colors">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button id="btnRepeat" class="text-slate-400 hover:text-rose-400 transition-colors">
                            <i class="fa-solid fa-repeat text-lg"></i>
                        </button>
                    </div>

                    <!-- Lista de Reproducción (Playlist) -->
                    <div class="w-full max-h-40 overflow-y-auto pr-1 custom-scrollbar border-t border-rose-500/10 pt-4">
                        <ul id="playlistContainer" class="space-y-2">
                            <!-- JS insertará aquí las canciones -->
                        </ul>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <!-- Modal / Lightbox para ver la foto ampliada con descripción -->
    <div id="photoModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-rose-500/30 rounded-3xl p-6 max-w-lg w-full shadow-[0_0_40px_rgba(244,63,94,0.3)] relative flex flex-col items-center transform scale-95 transition-transform duration-300" id="photoModalCard">
            <!-- Botón Cerrar -->
            <button id="closeModalBtn" class="absolute top-4 right-4 text-slate-400 hover:text-rose-400 text-xl w-9 h-9 rounded-full bg-slate-800/80 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <!-- Imagen Ampliada -->
            <div class="w-full h-72 sm:h-80 rounded-2xl overflow-hidden mb-4 border border-rose-500/20 shadow-lg">
                <img id="modalImage" src="" alt="Foto ampliada" class="w-full h-full object-cover">
            </div>
            
            <!-- Descripción de la Foto -->
            <p id="modalCaption" class="text-rose-100 text-center font-dancing text-2xl sm:text-3xl drop-shadow-md">
                <!-- La descripción se insertará dinámicamente -->
            </p>
        </div>
    </div>
    <!-- SECCIÓN DE CARTAS DE AMOR -->
        <section class="w-full max-w-4xl mt-12 px-4 flex flex-col items-center">
            <div class="text-center mb-6">
                <h2 class="font-dancing text-4xl md:text-5xl text-rose-300 drop-shadow-[0_0_10px_rgba(244,63,94,0.5)]">
                    Cartas para Ti
                </h2>
                <p class="text-rose-200/70 text-xs md:text-sm tracking-widest uppercase">Palabras escritas desde el fondo del corazón</p>
            </div>

            <!-- Contenedor de Sobres -->
            <div id="lettersContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 w-full">
                <!-- Las cartas se insertarán dinámicamente con JavaScript -->
            </div>
        </section>

        <!-- Modal para Leer la Carta -->
        <div id="letterModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
            <div class="bg-[#fdfbf7] text-slate-800 border-2 border-rose-300 rounded-2xl p-6 md:p-8 max-w-lg w-full shadow-[0_0_40px_rgba(244,63,94,0.4)] relative flex flex-col transform scale-95 transition-transform duration-300" id="letterModalCard">
                <!-- Botón Cerrar -->
                <button id="closeLetterBtn" class="absolute top-4 right-4 text-slate-400 hover:text-rose-600 text-xl w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                
                <!-- Contenido de la Carta -->
                <h3 id="letterModalTitle" class="font-dancing text-3xl md:text-4xl text-rose-800 mb-4 border-b border-rose-200 pb-2">Título de la Carta</h3>
                <div class="max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                    <p id="letterModalContent" class="font-poppins text-sm md:text-base leading-relaxed text-slate-700 whitespace-pre-line">
                        Texto de la carta...
                    </p>
                </div>
            </div>
        </div>

    <!-- Elemento Audio Oculto -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <!-- JS Principal Vinculado -->
    <script src="app.js"></script>
</body>
</html>
